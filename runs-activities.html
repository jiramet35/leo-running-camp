<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ส่งผลซ้อม</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f3f4f6;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px; /* 🔥 กันชนขอบจอ */
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 28px 24px; /* 🔥 เพิ่ม padding */
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
  margin-bottom: 22px;
}

.form-group {
  margin-bottom: 16px;
}

label {
  font-size: 13px;
  color: #6b7280;
  display: block;
  margin-bottom: 6px;
}

input, textarea, select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  font-size: 14px;
  box-sizing: border-box; /* 🔥 แก้ล้นขวา */
}

textarea {
  height: 80px;
  resize: none;
}

.row {
  display: flex;
  gap: 12px;
}

.row .form-group {
  flex: 1;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  background: linear-gradient(135deg,#7c3aed,#9333ea);
  color: white;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

/* effort */
.effort-box {
  text-align: center;
  margin-top: 6px;
}

.effort-value {
  font-size: 28px;
  font-weight: bold;
  color: #7c3aed;
  margin-bottom: 6px;
}

input[type=range] {
  width: 100%;
}

.levels {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-top: 10px;
}

.level-btn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid #ddd;
  background: white;
  cursor: pointer;
}

.level-btn.active {
  background: #7c3aed;
  color: white;
}

#status {
  text-align: center;
  margin-top: 12px;
  font-size: 14px;
}

.checkbox-group label {
  display: flex;
  align-items: center;   /* 🔥 จัดให้อยู่กึ่งกลางแนวตั้ง */
  gap: 8px;
  cursor: pointer;
  font-size: 14px;
}

.checkbox-group input {
  width: 16px;
  height: 16px;
}

.loading-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  backdrop-filter: blur(3px);
}

.spinner{
  width:60px;
  height:60px;
  border:6px solid #ffffff55;
  border-top:6px solid #fff;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

.loading-text{
  margin-top:15px;
  color:white;
  font-size:18px;
  font-weight:bold;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

</style>
</head>

<body>

<div class="card">
<h2>🏃‍♂️ ส่งผลซ้อม</h2>

<div class="form-group">
<label>วันที่</label>
<input type="date" id="date">
</div>

<div class="form-group">
<label>ประเภทการซ้อม / Type</label>
<select id="type">
<option value="easy">Easy</option>
<option value="interval">Interval</option>
<option value="tempo">Tempo</option>
<option value="longrun">Long Run</option>
</select>
</div>

<div class="form-group checkbox-group">
  <label>
    <input type="checkbox" id="completed">
    <b style="color: red;">คุณวิ่งจบตามโปรแกรม / completed the program</b>
  </label>
</div>

<div class="row">
<div class="form-group">
<label>ระยะ (km) (ระยะรวมทั้งหมด / all dist.)</label>
<input id="distance" placeholder="10.50">
</div>

<div class="form-group">
<label>เพซเฉลี่ย / avg. pace</label>
<input id="avg_pace" placeholder="04:30">
</div>
</div>

<div class="form-group effort-box">
<label>ระดับความเหนื่อย / Exertion level</label>
<div class="effort-value" id="effortValue">5</div>
<input type="range" id="slider" min="1" max="10" value="5">
<div class="levels" id="levels"></div>
</div>

<h2>อัปโหลดรูป / Upload Img</h2>
<label style="color:indianred;">*** capture รูปจาก application วิ่ง หากมีหลายรูปให้รวมรูปเป็นรูปเดียวก่อน Capture images from the running application; if there are multiple images, merge them into a single image first.</label>
<input type="file" id="fileInput" accept="image/*">
<br><br>
<img id="preview" width="200" style="display:none;">

<div class="form-group">
<label>Garmin / Strava Link (ใส่หรือไม่ใส่ก็ได้ / Optional )</label>
<input id="link">
</div>

<div class="form-group">
<label>หมายเหตุ / Remark</label>
<textarea id="note" rows="10" cols="50" placeholder="อธิบายความรู้สึกหรือระบุ avg_pace ใน แต่ละ Laps ของ Interval / Describe your feelings or record the average pace for each interval lap."></textarea>
</div>

<button onclick="submitRun()">บันทึก</button>
<div id="status"></div>

</div>

<div id="loadingOverlay" class="loading-overlay" style="display:none;">
  <div class="spinner"></div>
  <div class="loading-text">กำลังส่งผลวิ่ง...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore,addDoc,collection ,getDoc , updateDoc , doc, setDoc , serverTimestamp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
document.addEventListener("DOMContentLoaded", () => {

  const params = new URLSearchParams(window.location.search);
  const dateParam = params.get("date");
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  //console.log("dateParam:", dateParam);

  if (dateParam) {
    const dateInput = document.getElementById("date");

    if (dateInput) {
      dateInput.value = dateParam;
    } else {
      console.error("ไม่เจอ input#date");
    }
  }

});

const CLOUD_NAME = "den5wregs";
const UPLOAD_PRESET = "leo-running-camp-hw";
const firebaseConfig = {
  apiKey: "AIzaSyDQ73R5g8CQyC76nKW9rPCCTwHm8ZRJaQw",
  authDomain: "leo-running-camp.firebaseapp.com",
  projectId: "leo-running-camp",
  storageBucket: "leo-running-camp.firebasestorage.app",
  messagingSenderId: "145488848267",
  appId: "1:145488848267:web:e8daabea6061c818fb7b8e",
  measurementId: "G-5FCB6D998V"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser=null;
const params = new URLSearchParams(location.search);
const editId = params.get("edit");
let imgLinkEdit = "";
let editRef = null;

onAuthStateChanged(auth,async u=>{
  if(!u) location.href="index.html";
  currentUser=u;
  if(editId){

  editRef = doc(db, "runs", editId);

  const snap = await getDoc(editRef);

  if(snap.exists()){

    const d = snap.data();

    document.getElementById("date").value = d.date || "";
    document.getElementById("distance").value = d.distance || "";
    document.getElementById("avg_pace").value = d.avg_pace || "";
    document.getElementById("type").value = d.type || "easy";
    document.getElementById("completed").checked = d.completed || false;
    document.getElementById("note").value = d.note || "";
    if (d.imgLink) {
      const img = document.getElementById("preview");
      img.src = d.imgLink;
      img.style.display = "block";
      imgLinkEdit = d.imgLink; //  append form data for edit
    }

    setEffort(d.effort || 5);
  }

      document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];

      if (file) {
        const img = document.getElementById("preview");

        img.src = URL.createObjectURL(file);
        img.style.display = "block";
      }
    });
}
});

// preview
fileInput.onchange = () => {
  const file = fileInput.files[0];
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
};

// effort
let effort=5;
const val=document.getElementById("effortValue");
const slider=document.getElementById("slider");
const levels=document.getElementById("levels");

for(let i=1;i<=10;i++){
  const b=document.createElement("button");
  b.innerText=i;
  b.className="level-btn";
  b.onclick=()=>setEffort(i);
  levels.appendChild(b);
}

function setEffort(v){
  effort=v;
  val.innerText=v;
  slider.value=v;
  document.querySelectorAll(".level-btn").forEach((b,i)=>{
    b.classList.toggle("active",i+1===v);
  });
}

slider.oninput=e=>setEffort(Number(e.target.value));
setEffort(5);

// submit
window.submitRun = async () => {
  if (!currentUser) return;
  
  const status = document.getElementById("status");
  const date = document.getElementById("date").value;
  const dist = document.getElementById("distance").value;
  const avg_pace = document.getElementById("avg_pace").value;
  
  // ✅ validate
  if (!date) {
    status.innerText = "กรุณาเลือกวันที่";
    return;
  }

  // images
  const file = fileInput.files[0];
  let finalImgLink = imgLinkEdit;
  //if (!file) return alert("เลือกไฟล์ก่อน");

  /*if (!file.type.startsWith("image/")) {
    return alert("ต้องเป็นรูปภาพเท่านั้น");
  }*/

  if (!/^\d+(\.\d{1,2})?$/.test(dist)) {
    //status.innerText = "ระยะไม่ถูกต้อง";
    alert("⚠️ ระบุระยะไม่ถูกต้อง");
    return;
  }

  if (!/^(0?[0-9]|10):[0-5][0-9]$/.test(avg_pace)) {
    alert("⚠️ ระบุเพซไม่ถูกต้อง (ตัวอย่าง 05:30)");
    return;
  }

  try {
    // 🔥 upload ไป Cloudinary
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);
    showLoading();
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
      method: "POST",
      body: formData
    });
    const data = await res.json();

    /* if (!res.ok) {
      console.error(data);
      return alert("Upload failed");
    }*/

    const imageUrl = data.secure_url || null;
    if(file){
      // upload ใหม่
      finalImgLink = imageUrl;
    }
    // 🔥 สร้าง id กันซ้ำ
    const docId = currentUser.uid + "_" + date;
    //console.log(docId);
    
    const ref = doc(db, "runs", docId);
    const existing = await getDoc(ref);
    if (!editId) {
      const existing = await getDoc(ref);
      
      if (existing.exists()) {
        alert(`⚠️ วันที่ ${safeDate} คุณส่งผลวิ่งแล้ว`);
        return;
      }
    }else if(editId){
      
        const imageUrl = finalImgLink || null;
    }

    

    // ✅ ใช้ setDoc แทน addDoc
    await setDoc(ref, {
      userId: currentUser.uid,
      date,
      type: document.getElementById("type").value,
      completed: document.getElementById("completed").checked,
      distance: Number(dist),
      avg_pace,
      effort,
      link: document.getElementById("link").value,
      note: document.getElementById("note").value,
      imgLink : finalImgLink,
      created_at: serverTimestamp() 
    });

    //status.innerText = "สำเร็จ 🎉";
    setTimeout(() => {
        alert("บันทึกสำเร็จ 🎉");
        location.reload();
    }, 2000);
  } catch (e) {
    console.error(e);
    status.innerText = e.message;
  }finally{
    hideLoading();
  }
};


function showLoading() {
  document.getElementById("loadingOverlay").style.display = "flex";
}

function hideLoading() {
  document.getElementById("loadingOverlay").style.display = "none";
}
</script>

</body>
</html>
