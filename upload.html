<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Upload Cloudinary</title>
</head>
<body>

<h2>อัปโหลดรูป</h2>

<input type="file" id="fileInput" accept="image/*">
<br><br>
<img id="preview" width="200" style="display:none;">
<br><br>
<button onclick="upload()">Upload</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInAnonymously , onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const CLOUD_NAME = "den5wregs";
const UPLOAD_PRESET = "leo-running-camp-hw";
const firebaseConfig = {
  apiKey: "AIzaSyDQ73R5g8CQyC76nKW9rPCCTwHm8ZRJaQw",
  authDomain: "leo-running-camp.firebaseapp.com",
  projectId: "leo-running-camp",
  storageBucket: "leo-running-camp.firebasestorage.app",
  messagingSenderId: "145488848267",
  appId: "1:145488848267:web:e8daabea6061c818fb7b8e",
  measurementId: "G-5FCB6D998V"
};

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser=null;

onAuthStateChanged(auth,u=>{
  if(!u) location.href="index.html";
  currentUser=u;
});

// preview
fileInput.onchange = () => {
  const file = fileInput.files[0];
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
};

window.upload = async () => {
  const user = auth.currentUser;
  console.log(auth.currentUser);
  if (!user) return alert("ยังไม่ login");

  const file = fileInput.files[0];
  if (!file) return alert("เลือกไฟล์ก่อน");

  if (!file.type.startsWith("image/")) {
    return alert("ต้องเป็นรูปภาพเท่านั้น");
  }

  if (file.size > 2 * 1024 * 1024) {
    return alert("ไฟล์ใหญ่เกิน 2MB");
  }

  try {
    // 🔥 upload ไป Cloudinary
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);

    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (!res.ok) {
      console.error(data);
      return alert("Upload failed");
    }

    const imageUrl = data.secure_url;

    // 🔥 save ลง Firestore
    await addDoc(collection(db, "images"), {
      userId: user.uid,
      url: imageUrl,
      createdAt: serverTimestamp()
    });

    preview.src = imageUrl;

    alert("อัปโหลดสำเร็จ 🎉");

  } catch (err) {
    console.error(err);
    alert("Upload error");
  }
}
</script>

</body>
</html>
